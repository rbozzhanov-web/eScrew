name: Deploy eScrew to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve eScrew version
        shell: bash
        run: |
          PR_NUMBER="$(git log -1 --pretty=%B | grep -oE '#[0-9]+' | tail -1 | tr -d '#' || true)"
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER="$(git log -2 --pretty=%B | grep -oE '#[0-9]+' | head -1 | tr -d '#' || true)"
          fi
          echo "EXPO_PUBLIC_ESCREW_VERSION=${PR_NUMBER:-unknown}" >> "$GITHUB_ENV"
      - run: npm install --ignore-scripts
      - run: npm run typecheck
      - run: npm run build:web
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
