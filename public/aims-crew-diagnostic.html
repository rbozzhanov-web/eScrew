<h1>AIMS Crew Diagnostic</h1>

<script>
const code=`javascript:(()=>{if(location.origin!=='https://aims.airastana.com'){alert('Open Air Astana AIMS first');return}const K='__escrewCrewDiag',A='https://aims.airastana.com',BAD=/pass|pwd|token|auth|cookie|session|csrf|secret|verification/i,root=window;const copy=()=>{const t=JSON.stringify(root[K]||{version:1,captures:[]},null,2);navigator.clipboard.writeText(t).then(()=>alert('Crew diagnostic copied')).catch(()=>prompt('Copy crew diagnostic',t))};if(root[K]&&root[K].armed){copy();return}const ty=v=>Array.isArray(v)?'array':v===null?'null':typeof v,shape=(v,d=0)=>{if(d>2)return ty(v);if(Array.isArray(v)){const x=v.find(i=>i&&typeof i==='object');return{type:'array',count:v.length,item:x?shape(x,d+1):undefined}}if(v&&typeof v==='object'){const f={};for(const[k,x]of Object.entries(v)){if(BAD.test(k))continue;f[k]=shape(x,d+1)}return{type:'object',fields:f}}return ty(v)},cap=[],seen=new Set(),add=(kind,path,method,status,v)=>{if(!path||path==='/eCrew/CrewSchedule/SchedulerEvents')return;const q=method+' '+path+' '+JSON.stringify(shape(v));if(seen.has(q))return;seen.add(q);cap.push({kind,path,method,status,shape:shape(v)});root[K]={version:1,armed:true,captures:cap}},path=(u,w)=>{try{const x=new URL(u,w.location.href);return x.origin===A?x.pathname:''}catch{return''}},patch=w=>{try{if(!w||w.location.origin!==A)return;const X=w.XMLHttpRequest&&w.XMLHttpRequest.prototype;if(X&&!X.__ecd){X.__ecd=1;const o=X.open,s=X.send;X.open=function(m,u){this.__m=String(m||'GET').toUpperCase();this.__u=u;return o.apply(this,arguments)};X.send=function(){this.addEventListener('load',()=>{try{const p=path(this.__u,w);if(!p)return;const v=this.responseType==='json'?this.response:JSON.parse(this.responseText);add('xhr',p,this.__m,this.status,v)}catch{}});return s.apply(this,arguments)}}if(w.fetch&&!w.fetch.__ecd){const f=w.fetch.bind(w),g=async function(i,n){const u=i&&i.url?i.url:i,m=String((n&&n.method)||(i&&i.method)||'GET').toUpperCase(),r=await f(i,n);try{const p=path(u,w);if(p)r.clone().json().then(v=>add('fetch',p,m,r.status,v)).catch(()=>{})}catch{}return r};g.__ecd=1;w.fetch=g}}catch{}},frame=f=>{try{patch(f.contentWindow);f.addEventListener('load',()=>patch(f.contentWindow))}catch{}};patch(window);for(const f of document.querySelectorAll('iframe'))frame(f);new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes)if(n&&n.querySelectorAll){if(n.tagName==='IFRAME')frame(n);for(const f of n.querySelectorAll('iframe'))frame(f)}}).observe(document.documentElement,{childList:true,subtree:true});root[K]={version:1,armed:true,captures:cap};alert('Crew diagnostic armed. Open one flight and its crew/details, wait for it to load, then run this bookmark again.')})()`;
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(code);document.getElementById('status').textContent='Copied. Replace your Safari diagnostic bookmark URL with this code.'}catch{prompt('Copy bookmark URL',code)}};
</script>
