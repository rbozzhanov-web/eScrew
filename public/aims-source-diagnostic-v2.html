<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>eScrew AIMS Source Diagnostic v2</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:720px;margin:40px auto;padding:0 20px;line-height:1.45}button{font:inherit;padding:12px 16px;border-radius:10px;border:1px solid #bbb;background:#fff}</style>
<h1>AIMS Source Diagnostic v2</h1>
<p>Maps same-origin document and iframe paths without exporting page text, form values, storage, cookies, tokens, request bodies, query strings or URL fragments.</p>
<button id="copy">Copy AIMS Source Diagnostic v2</button><p id="status"></p>
<script>
const code=`javascript:(()=>{try{if(location.origin!=='https://aims.airastana.com'){alert('Open AIMS first');return}const safePath=u=>{try{const x=new URL(u,location.href);return x.origin===location.origin?x.pathname:null}catch{return null}};const scan=(d,label,depth,out)=>{if(depth>4)return;let documentPath=null;try{documentPath=d.location.origin===location.origin?d.location.pathname:null}catch{}const scripts=[...d.scripts].map(s=>safePath(s.src)).filter(Boolean);const links=[...d.querySelectorAll('link[href]')].map(x=>safePath(x.href)).filter(Boolean);const anchors=[...d.querySelectorAll('a[href]')].map(a=>safePath(a.href)).filter(Boolean);const forms=[...d.forms].map(f=>({method:(f.method||'get').toUpperCase(),action:safePath(f.action||d.location.href)}));const frames=[...d.querySelectorAll('iframe')];out.push({label,depth,path:documentPath,titleLength:(d.title||'').length,elementCount:d.querySelectorAll('*').length,scripts:[...new Set(scripts)],styles:[...new Set(links)],sameOriginLinks:[...new Set(anchors)],forms,iframeCount:frames.length});frames.forEach((f,i)=>{try{if(f.contentDocument)scan(f.contentDocument,label+'.frame'+(i+1),depth+1,out)}catch{out.push({label:label+'.frame'+(i+1),depth:depth+1,path:null,inaccessible:true})}})};const documents=[];scan(document,'main',0,documents);const result={version:2,note:'AIMS navigation/source structure only. Paths exclude query strings and fragments. No page text, names, staff IDs, form values, local/session storage, cookies, credentials, CSRF/verification tokens, request bodies or session data are emitted.',page:{origin:location.origin,path:location.pathname},documents};const text=JSON.stringify(result,null,2);navigator.clipboard.writeText(text).then(()=>alert('AIMS source diagnostic v2 copied')).catch(()=>prompt('Copy diagnostic:',text))}catch(e){alert('Diagnostic failed')}})()`;
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(code);document.getElementById('status').textContent='Copied. Replace the URL of your existing Safari diagnostic bookmark with this code.'}catch{document.getElementById('status').textContent='Copy failed.'}};
</script>
